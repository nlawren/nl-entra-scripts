[project]
name = "entra-scripts"
version = "0.1.0"
description = "Standalone read-only Entra scripts"
requires-python = ">=3.14"
dependencies = [
    "azure-identity",
    "requests",
    "rich",
    "rich-argparse",
    "xlsxwriter",
]

[dependency-groups]
dev = ["ruff", "ty"]

[tool.uv]
required-version = ">=0.12"
package = false
